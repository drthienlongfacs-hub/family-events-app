name: Daily Harvest & Deploy

on:
  schedule:
    # Run everyday at 00:00 UTC (07:00 AM VN Time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  harvest-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 🚀 Run Autonomous Harvester (Scraping & Verification)
        run: node lib/scraper-github.mjs
        
      - name: 🛡️ CDMS Enterprise Quality Gate Enforcement
        run: node lib/verify_quality_gate.mjs
        
      - name: Commit Fresh Data & Evolution Logs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/events.json public/data/evolution_log.json public/data/system_health.json
          git commit -m "chore: auto harvest daily family events & logs" || exit 0
          git push

      - name: Build Next.js Static Export
        run: npm run build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: harvest-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
